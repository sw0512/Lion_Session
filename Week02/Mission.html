<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기초대사량 계산기</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      border-radius: 8px;
      color: #333;
      font-weight: bold;
      text-align: center;
      font-size: 18px;
      min-height: 25px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🦁 기초대사량 계산기</h1>
    
    <div class="form-group">
      <label for="height">키 (cm):</label>
      <input type="number" id="height" placeholder="예: 175" />
    </div>

    <div class="form-group">
      <label for="weight">몸무게 (kg):</label>
      <input type="number" id="weight" placeholder="예: 70" />
    </div>

    <div class="form-group">
      <label for="age">나이 (세):</label>
      <input type="number" id="age" placeholder="예: 25" />
    </div>

    <div class="form-group">
      <label for="gender">성별:</label>
      <select id="gender">
        <option value="male">남성</option>
        <option value="female">여성</option>
      </select>
    </div>

    <button onclick="calculate()">계산하기</button>

    <div id="result"></div>
  </div>

  <script>
    function calculate() {
      const height = parseFloat(document.getElementById("height").value);
      const weight = parseFloat(document.getElementById("weight").value);
      const age = parseFloat(document.getElementById("age").value);
      const gender = document.getElementById("gender").value;

      let bmr;

      if (gender === "male") {
        bmr = 10 * weight + 6.25 * height - 5 * age + 5;
      } else {
        bmr = 10 * weight + 6.25 * height - 5 * age - 161;
      }

      document.getElementById("result").innerText =
        "결과: " + Math.round(bmr) + " kcal"; //round는 반올림 함수
    }
  </script>
</body>
</html>
